<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mobiDziennik</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#f2f2f2;color:#111}
body.dark{background:#111;color:#eee}
body.dark .box,body.dark .panel,body.dark .grades-header,body.dark .user-card,body.dark .attachment-card{background:#1e1e1e;color:#eee;border-color:#333}
body.dark input,body.dark textarea,body.dark select{background:#222;color:#eee;border-color:#555}
button,input,select,textarea{font-family:inherit}
#loadingScreen{position:fixed;inset:0;background:white;z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center}
body.dark #loadingScreen{background:#111}
.loading-logo{font-size:34px;font-weight:bold;color:#006092;margin-bottom:160px}.loading-logo span{color:#f4a11a}
.loader-icon{width:96px;height:96px;border-radius:50%;border:12px solid #0a6695;border-top-color:transparent;animation:spin 1s linear infinite;margin-bottom:28px}
.loading-text{font-size:28px;color:#006092}@keyframes spin{to{transform:rotate(360deg)}}
#loginScreen{width:100%;min-height:100vh;display:none;justify-content:center;align-items:flex-start;padding-top:85px;background:#dcdcdc}
body.dark #loginScreen{background:#111}
.login-panel{width:600px;background:#fff;border:1px solid #d0d0d0;border-radius:4px;box-shadow:0 1px 8px rgba(0,0,0,.15);overflow:hidden}
body.dark .login-panel{background:#1e1e1e}
.login-header{text-align:center;padding:18px 0 14px;border-bottom:1px solid #e2e2e2}
.mobid-logo{font-size:28px;font-weight:bold;color:#0d5d9c}.mobid-logo span{color:#e5a032}.mobid-logo sup{color:#999;font-size:12px;position:relative;top:-10px}
.login-body{display:grid;grid-template-columns:220px 1fr;gap:25px;padding:28px 34px 34px;align-items:center}
.login-left{text-align:center}.school-avatar{width:110px;height:110px;object-fit:cover;margin:0 auto 18px;display:block;background:#075b91;color:#fff;font-size:44px;font-weight:bold;line-height:110px}.school-name{font-size:16px;font-weight:bold;color:#222;text-align:left}body.dark .school-name{color:#eee}
.login-row{display:grid;grid-template-columns:100px 1fr;gap:14px;align-items:center;margin-bottom:14px}.login-row label{text-align:right;font-weight:bold}
.login-row input{height:34px;padding:6px 10px;border:1px solid #b7c3d0;border-radius:3px;background:#eef4fb}
.login-main-btn{width:100%;height:38px;border:none;border-radius:4px;background:linear-gradient(#3f8dd3,#2167a8);color:white;font-size:16px;font-weight:bold;cursor:pointer}
.login-links{display:flex;justify-content:space-between;margin-top:12px;font-size:12px}.login-links a{color:#4e83be;text-decoration:none}.message{text-align:center;color:red;margin-top:12px;min-height:18px}
#mainPage{display:none}.app-topbar{height:74px;background:#005f8d;color:white;display:flex;align-items:center;padding:0 20px;gap:18px;position:sticky;top:0;z-index:1000}
.hamburger{width:44px;height:44px;border:none;background:transparent;color:white;font-size:34px;cursor:pointer;line-height:1}.app-logo{font-size:34px;font-weight:bold;letter-spacing:-1px}.app-logo span{color:#f5a31a}
#loggedUser{margin-left:auto;font-size:14px;text-align:right;line-height:1.3}.content{padding:28px}.page{display:none}.active{display:block}.page h1{font-size:42px;margin-bottom:12px}
#drawerOverlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:2000;display:none}
#sideDrawer{position:fixed;left:-330px;top:0;width:330px;max-width:88vw;height:100vh;background:#006391;color:white;z-index:2001;transition:.25s;overflow-y:auto;box-shadow:4px 0 12px rgba(0,0,0,.25)}
#sideDrawer.open{left:0}.drawer-top{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid rgba(255,255,255,.25)}
.drawer-top button{background:transparent;color:white;border:none;padding:18px 8px;font-size:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.drawer-item{width:100%;border:none;background:transparent;color:white;display:flex;align-items:center;gap:22px;padding:18px 24px;font-size:24px;cursor:pointer;text-align:left}
.drawer-item:hover,.drawer-item.active-menu{background:#0e78a8}.drawer-icon{font-size:28px;width:38px;text-align:center}.badge{background:#f6a51a;color:white;border-radius:10px;padding:2px 9px;font-size:18px;margin-left:auto}
.drawer-sync{border-top:1px solid rgba(255,255,255,.25);padding:20px 24px;display:flex;gap:18px;align-items:center;font-size:19px;line-height:1.35}.sync-icon{font-size:34px}
.box,.panel{background:white;padding:20px;border-radius:10px;margin-top:15px;box-shadow:0 2px 5px rgba(0,0,0,.08)}
.panel input,.panel select,.panel textarea,.panel button{padding:10px;margin:8px 8px 8px 0}.panel input,.panel select,.panel textarea{border:1px solid #ccc;border-radius:6px}.panel textarea{width:100%;min-height:90px;resize:vertical}.panel button{background:#0072d6;color:white;border:none;border-radius:6px;cursor:pointer}.panel button:disabled{background:#999}
.small-info{font-size:13px;color:#666;margin-top:8px}.upload-info{font-size:14px;color:#0b71c8;font-weight:bold;margin-top:8px}.lesson,.chat-message{font-size:18px;margin-bottom:12px;padding:10px;border-bottom:1px solid #eee}
.msg-dir{display:inline-block;font-size:12px;font-weight:bold;padding:3px 9px;border-radius:99px;margin-bottom:6px;background:#dceeff;color:#064c79}
.msg-meta{font-size:13px;color:#556;margin-top:6px}
.user-card{border:1px solid #ddd;border-radius:8px;padding:12px;margin:8px 0;background:#fafafa}.user-card b{color:#0b71c8}.delete-user-btn{background:#e74c3c!important;color:#fff!important;border:none;border-radius:6px;padding:7px 10px;margin-top:8px;cursor:pointer}
.item-card{border:1px solid #ddd;border-radius:8px;padding:14px;margin:10px 0;background:#fafafa}body.dark .item-card{background:#222;border-color:#444}.item-card h3{color:#0b71c8;margin-bottom:6px}.danger-btn{background:#e74c3c!important}

/* ==========================================
   MOBIDZIENNIK — MODERN AERO UI
========================================== */
:root {
    --aero-blue: #087dbb;
    --aero-deep: #075b91;
    --aero-accent: #f5a623;
    --aero-glass: rgba(255,255,255,.78);
    --aero-border: rgba(255,255,255,.75);
    --aero-shadow: 0 10px 35px rgba(26,75,115,.10);
    --aero-radius: 18px;
}
html { min-height:100%; background:#b9d9ef; scroll-behavior:smooth; }
body {
    min-height:100vh;
    position:relative;
    isolation:isolate;
    background:linear-gradient(135deg,#c6e6fa 0%,#e7f4ff 42%,#b9d5ee 100%) !important;
    color:#203348;
    transition:background .3s ease,color .3s ease;
}
body::before {
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 12% 8%,rgba(255,255,255,.96) 0%,rgba(255,255,255,0) 34%),
    radial-gradient(ellipse at 88% 18%,rgba(79,174,232,.38) 0%,rgba(79,174,232,0) 38%),
    radial-gradient(ellipse at 48% 100%,rgba(91,157,213,.30) 0%,rgba(91,157,213,0) 48%),
    linear-gradient(145deg,#c7e8fb 0%,#eaf6ff 48%,#bfdcf2 100%);
}
#mainPage { min-height:100vh; }
.content { max-width:1500px;margin:auto;padding:32px;min-height:calc(100vh - 76px); }
.page h1 { color:#173d5d;font-size:36px;font-weight:750;letter-spacing:-.8px;margin-bottom:22px; }
.box,.panel,.user-card,.item-card,.chat-message {
  background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(232,246,255,.48)) !important;
  border:1px solid rgba(255,255,255,.88) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 12px 32px rgba(31,92,137,.14),0 2px 7px rgba(31,92,137,.07) !important;
  backdrop-filter:blur(24px) saturate(155%);
  -webkit-backdrop-filter:blur(24px) saturate(155%);
  border-radius:var(--aero-radius);
}
.box,.panel { padding:25px;margin-top:20px; }
.item-card,.user-card { padding:20px;margin:14px 0; }
.app-topbar {
  height:76px;padding:0 30px;position:sticky;overflow:visible;
  background:linear-gradient(180deg,#e5f6ff 0%,#c8ebfc 24%,#8bcdf0 62%,#4a9fce 100%) !important;
  border-top:1px solid rgba(255,255,255,.98) !important;
  border-bottom:1px solid rgba(23,104,157,.42) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.98),inset 0 -1px 0 rgba(255,255,255,.24),0 8px 28px rgba(24,91,137,.22) !important;
}
.app-logo { color:#064c79 !important;text-shadow:0 1px 0 rgba(255,255,255,.85) !important;font-size:32px;letter-spacing:-1.5px; }
.app-logo span { color:#075b91 !important; }
#loggedUser { color:#06466f !important;text-shadow:0 1px 0 rgba(255,255,255,.8) !important;font-weight:700;margin-left:auto; }
.hamburger {
  width:46px;height:46px;border-radius:14px;
  color:#07527f !important;background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(200,233,251,.50)) !important;
  border:1px solid rgba(255,255,255,.94) !important;box-shadow:inset 0 1px 0 #fff,0 3px 10px rgba(27,95,141,.16) !important;
}
#sideDrawer {
  background:linear-gradient(180deg,rgba(223,245,255,.97) 0%,rgba(158,216,247,.97) 22%,rgba(48,139,195,.98) 100%) !important;
  border-right:1px solid rgba(255,255,255,.88) !important;border-radius:0 22px 22px 0 !important;
}
.drawer-item { color:#fff !important;text-shadow:0 1px 2px rgba(0,49,83,.52);font-size:19px;padding:16px 22px;margin:3px 9px;width:calc(100% - 18px);border-radius:12px; }
.drawer-item:hover,.drawer-item.active-menu { background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.13)) !important; }
.panel button { background:linear-gradient(135deg,#168bd0,#0665ae);border-radius:11px;padding:11px 17px;font-weight:650; }
input,select,textarea { border:1px solid rgba(110,150,190,.3) !important;border-radius:11px !important;background:rgba(255,255,255,.78);color:#203348;padding:11px 13px !important; }

body.dark,body.dark #mainPage { background:#101c2a !important;color:#e3edf7; }
body.dark::before {
  background:
    radial-gradient(ellipse at 12% 8%,rgba(45,92,130,.42),transparent 36%),
    radial-gradient(ellipse at 88% 18%,rgba(24,105,154,.32),transparent 38%),
    linear-gradient(145deg,#101c2a,#1b3045 55%,#101a29);
}
body.dark .box,body.dark .panel,body.dark .user-card,body.dark .item-card,body.dark .chat-message {
  background:linear-gradient(135deg,rgba(35,58,79,.82),rgba(20,38,57,.78)) !important;
  border-color:rgba(190,225,255,.18) !important;
}
body.dark .page h1 { color:#72c5fa; }
body.dark input,body.dark textarea,body.dark select { background:rgba(20,32,47,.9);color:#e8f2fc; }
body.dark .msg-dir { background:#1c4768;color:#cbe9ff; }
body.dark .msg-meta { color:#b2c7da; }

@media(max-width:700px) {
  .content { padding:12px; }
  .login-body { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="loading-logo">mobi<span>Dziennik</span></div>
  <div class="loader-icon"></div>
  <div class="loading-text">Ładowanie...</div>
</div>

<div id="loginScreen">
  <div class="login-panel">
    <div class="login-header">
      <div class="mobid-logo">mobi<span>Dziennik</span><sup>®</sup></div>
    </div>
    <form class="login-body" id="loginForm">
      <div class="login-left">
        <div class="school-avatar">mD</div>
        <div class="school-name">Szkoła Podstawowa nr 1</div>
      </div>
      <div>
        <div class="login-row">
          <label for="loginInput">Login:</label>
          <input id="loginInput" type="text" placeholder="np. nauczyciel" required>
        </div>
        <div class="login-row">
          <label for="passInput">Hasło:</label>
          <input id="passInput" type="password" placeholder="np. 1234" required>
        </div>
        <button class="login-main-btn" type="submit">Zaloguj</button>
        <div class="message" id="loginMessage"></div>
        <div class="small-info">Testowe konta: <b>uczen</b>, <b>nauczyciel</b>, <b>admin</b> (hasło: <b>1234</b>)</div>
      </div>
    </form>
  </div>
</div>

<div id="drawerOverlay" onclick="closeDrawer()"></div>
<aside id="sideDrawer">
  <div class="drawer-top">
    <button type="button" onclick="toggleDarkMode()">🌓 Motyw</button>
    <button type="button" onclick="logout()">🚪 Wyloguj</button>
  </div>
  <button class="drawer-item active-menu" data-page="messagesPage" onclick="showPage('messagesPage', this)">
    <span class="drawer-icon">✉️</span> Wiadomości <span class="badge" id="msgBadge">0</span>
  </button>
  <button class="drawer-item" data-page="teachersPage" onclick="showPage('teachersPage', this)">
    <span class="drawer-icon">👩‍🏫</span> Nauczyciele
  </button>
  <div class="drawer-sync">
    <div class="sync-icon">🔄</div>
    <div>Dane zapisywane lokalnie w przeglądarce</div>
  </div>
</aside>

<div id="mainPage">
  <header class="app-topbar">
    <button class="hamburger" type="button" onclick="openDrawer()" aria-label="Menu">☰</button>
    <div class="app-logo">mobi<span>Dziennik</span></div>
    <div id="loggedUser"></div>
  </header>

  <main class="content">
    <!-- WIADOMOŚCI -->
    <section id="messagesPage" class="page active">
      <h1>Wiadomości</h1>

      <div class="panel">
        <h3>Wyślij wiadomość</h3>
        <select id="recipientSelect"></select>
        <select id="msgFilterSelect" onchange="renderMessages()">
          <option value="all">Wszystkie (odebrane i wysłane)</option>
          <option value="sent">Tylko wysłane przeze mnie</option>
          <option value="received">Tylko odebrane przeze mnie</option>
        </select>
        <textarea id="msgInput" placeholder="Wpisz treść wiadomości..."></textarea>
        <button type="button" onclick="sendMessage()">Wyślij wiadomość</button>
      </div>

      <div class="box" id="messagesList"></div>
    </section>

    <!-- NAUCZYCIELE -->
    <section id="teachersPage" class="page">
      <h1>Nauczyciele</h1>

      <div class="panel">
        <h3>Dodaj nauczyciela</h3>
        <input id="teacherNameInput" type="text" placeholder="Imię i nazwisko">
        <input id="teacherSubjectInput" type="text" placeholder="Przedmiot (np. Matematyka)">
        <input id="teacherLoginInput" type="text" placeholder="Login (opcjonalnie)">
        <button type="button" onclick="addTeacher()">Dodaj nauczyciela</button>
      </div>

      <div class="box" id="teachersList"></div>
    </section>
  </main>
</div>

<script>
const STORAGE_USERS_KEY = 'mobidziennik_users_v1';
const STORAGE_MSGS_KEY = 'mobidziennik_msgs_v1';

const DEFAULT_USERS = [
  { id: 'u1', login: 'uczen', password: '1234', name: 'Jan Kowalski', role: 'student', subject: '' },
  { id: 'u2', login: 'nauczyciel', password: '1234', name: 'Anna Nowak', role: 'teacher', subject: 'Matematyka' },
  { id: 'u3', login: 'admin', password: '1234', name: 'Piotr Zieliński', role: 'teacher', subject: 'Informatyka' }
];

const DEFAULT_MSGS = [
  {
    id: 'm1',
    fromId: 'u2',
    toId: 'u1',
    text: 'Dzień dobry, przypominam o kartkówce z ułamków w piątek.',
    time: '08:15'
  }
];

let users = JSON.parse(localStorage.getItem(STORAGE_USERS_KEY) || 'null') || DEFAULT_USERS;
let messages = JSON.parse(localStorage.getItem(STORAGE_MSGS_KEY) || 'null') || DEFAULT_MSGS;
let currentUser = null;

function saveData() {
  localStorage.setItem(STORAGE_USERS_KEY, JSON.stringify(users));
  localStorage.setItem(STORAGE_MSGS_KEY, JSON.stringify(messages));
}

function getUserById(id) {
  return users.find(u => String(u.id) === String(id)) || { name: 'Usunięty użytkownik', role: 'user' };
}

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }, 400);
});

document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const login = document.getElementById('loginInput').value.trim().toLowerCase();
  const pass = document.getElementById('passInput').value;
  const msgEl = document.getElementById('loginMessage');

  const found = users.find(u => u.login.toLowerCase() === login && u.password === pass);
  if (!found) {
    msgEl.textContent = 'Nieprawidłowy login lub hasło.';
    return;
  }

  msgEl.textContent = '';
  currentUser = found;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainPage').style.display = 'block';
  document.getElementById('loggedUser').innerHTML = `<b>${escapeHtml(currentUser.name)}</b><br><span>${escapeHtml(currentUser.login)}</span>`;

  refreshRecipients();
  renderMessages();
  renderTeachers();
});

function logout() {
  currentUser = null;
  closeDrawer();
  document.getElementById('mainPage').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('passInput').value = '';
}

function toggleDarkMode() {
  document.body.classList.toggle('dark');
}

function openDrawer() {
  document.getElementById('sideDrawer').classList.add('open');
  document.getElementById('drawerOverlay').style.display = 'block';
}

function closeDrawer() {
  document.getElementById('sideDrawer').classList.remove('open');
  document.getElementById('drawerOverlay').style.display = 'none';
}

function showPage(pageId, btnEl) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  document.querySelectorAll('.drawer-item').forEach(b => b.classList.remove('active-menu'));
  if (btnEl) btnEl.classList.add('active-menu');
  closeDrawer();
}

/* ================= NAUCZYCIELE + POPRAWNE USUWANIE ================= */
function addTeacher() {
  const nameInput = document.getElementById('teacherNameInput');
  const subjInput = document.getElementById('teacherSubjectInput');
  const loginInput = document.getElementById('teacherLoginInput');

  const name = nameInput.value.trim();
  const subject = subjInput.value.trim() || 'Ogólny';
  const baseLogin = (loginInput.value.trim() || name.toLowerCase().replace(/[^a-z0-9]/g, '') || 'nauczyciel');

  if (!name) {
    alert('Podaj imię i nazwisko nauczyciela.');
    return;
  }

  const newTeacher = {
    id: 't_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    login: baseLogin,
    password: '1234',
    name,
    role: 'teacher',
    subject
  };

  users.push(newTeacher);
  saveData();

  nameInput.value = '';
  subjInput.value = '';
  loginInput.value = '';

  renderTeachers();
  refreshRecipients();
  renderMessages();
}

function deleteTeacher(teacherId) {
  if (!teacherId) return;

  // Nie pozwól usunąć aktualnie zalogowanego użytkownika (chyba że chcesz - tu bezpiecznik)
  if (currentUser && String(currentUser.id) === String(teacherId)) {
    alert('Nie możesz usunąć aktualnie zalogowanego konta.');
    return;
  }

  users = users.filter(u => String(u.id) !== String(teacherId));
  saveData();

  renderTeachers();
  refreshRecipients();
  renderMessages();
}

function renderTeachers() {
  const listEl = document.getElementById('teachersList');
  const teachers = users.filter(u => u.role === 'teacher');

  if (teachers.length === 0) {
    listEl.innerHTML = '<div class="small-info">Brak nauczycieli na liście. Dodaj kogoś powyżej.</div>';
    return;
  }

  listEl.innerHTML = teachers.map(t => `
    <div class="user-card">
      <div><b>${escapeHtml(t.name)}</b> — ${escapeHtml(t.subject || 'Nauczyciel')}</div>
      <div class="msg-meta">Login: ${escapeHtml(t.login)}</div>
      <button type="button" class="delete-user-btn" data-teacher-id="${escapeHtml(t.id)}">Usuń nauczyciela</button>
    </div>
  `).join('');
}

// Delegacja zdarzeń na liście nauczycieli — działa zawsze po przerenderowaniu
document.getElementById('teachersList').addEventListener('click', (e) => {
  const btn = e.target.closest('.delete-user-btn');
  if (!btn) return;
  const id = btn.getAttribute('data-teacher-id');
  deleteTeacher(id);
});

/* ================= WIADOMOŚCI (WIDOCZNE DLA NADAWCY I ODBIORCY) ================= */
function refreshRecipients() {
  const select = document.getElementById('recipientSelect');
  if (!currentUser) return;

  const others = users.filter(u => String(u.id) !== String(currentUser.id));
  if (others.length === 0) {
    select.innerHTML = '<option value="">Brak innych użytkowników</option>';
    return;
  }

  select.innerHTML = others.map(u => `
    <option value="${escapeHtml(u.id)}">${escapeHtml(u.name)} (${u.role === 'teacher' ? 'Nauczyciel' : 'Uczeń'})</option>
  `).join('');
}

function sendMessage() {
  if (!currentUser) return;
  const toId = document.getElementById('recipientSelect').value;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();

  if (!toId) {
    alert('Wybierz adresata wiadomości.');
    return;
  }
  if (!text) {
    alert('Wpisz treść wiadomości.');
    return;
  }

  messages.unshift({
    id: 'm_' + Date.now(),
    fromId: currentUser.id,
    toId,
    text,
    time: new Date().toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' })
  });

  saveData();
  input.value = '';
  renderMessages();
}

function renderMessages() {
  const listEl = document.getElementById('messagesList');
  const badgeEl = document.getElementById('msgBadge');
  const filter = document.getElementById('msgFilterSelect').value;

  if (!currentUser) return;

  // Wiadomości, w których bierze udział zalogowany użytkownik (wysłane LUB odebrane)
  const myMessages = messages.filter(
    m => String(m.fromId) === String(currentUser.id) || String(m.toId) === String(currentUser.id)
  );

  const receivedCount = myMessages.filter(m => String(m.toId) === String(currentUser.id)).length;
  badgeEl.textContent = String(receivedCount);

  let filtered = myMessages;
  if (filter === 'sent') {
    filtered = myMessages.filter(m => String(m.fromId) === String(currentUser.id));
  } else if (filter === 'received') {
    filtered = myMessages.filter(m => String(m.toId) === String(currentUser.id));
  }

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="small-info">Brak wiadomości w tym widoku.</div>';
    return;
  }

  listEl.innerHTML = filtered.map(m => {
    const isSentByMe = String(m.fromId) === String(currentUser.id);
    const sender = getUserById(m.fromId);
    const recipient = getUserById(m.toId);

    const directionLabel = isSentByMe
      ? `Wysłano do: ${escapeHtml(recipient.name)}`
      : `Odebrano od: ${escapeHtml(sender.name)}`;

    return `
      <div class="chat-message">
        <span class="msg-dir">${directionLabel}</span>
        <div>${escapeHtml(m.text)}</div>
        <div class="msg-meta">Nadawca: ${escapeHtml(sender.name)} → Adresat: ${escapeHtml(recipient.name)} • ${escapeHtml(m.time)}</div>
      </div>
    `;
  }).join('');
}

function escapeHtml(str) {
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}
</script>
</body>
</html>
